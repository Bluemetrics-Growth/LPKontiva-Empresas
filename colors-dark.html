<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body)}</style></head><body>
<div style="background:var(--azul-profundo);border-radius:16px;padding:20px 24px;position:relative;overflow:hidden">
<div style="position:absolute;inset:0;background:radial-gradient(360px 160px at 100% 0%,color-mix(in oklab,var(--ciano) 22%,transparent),transparent 70%)"></div>
<div style="position:relative;display:flex;gap:28px;align-items:center">
<div><div style="color:var(--claro-escuro);font-weight:700;font-size:17px">Texto claro é #EAF6FF</div><div style="color:rgba(234,246,255,0.6);font-size:13px;margin-top:4px">nunca branco puro — rgba(234,246,255,.6) para secundário</div></div>
<div style="margin-left:auto;display:flex;gap:10px;align-items:center">
<span style="font-family:var(--font-mono);font-size:12px;color:var(--ciano)">R$ 6.180,00</span>
<span style="border:1px solid rgba(255,255,255,0.1);border-radius:99px;padding:4px 10px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:rgba(234,246,255,0.7)">ok</span>
<span style="background:var(--ciano);color:var(--azul-profundo);border-radius:99px;padding:4px 10px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:700">flagged</span>
</div></div></div>
</body></html>
