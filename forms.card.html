<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:22px 24px;font-family:var(--font-body);max-width:560px}</style></head><body>
<div class="f-row">
<div class="f-field"><label>Nome</label><input type="text" placeholder="Seu nome"></div>
<div class="f-field"><label>Telefone / WhatsApp <span class="opt">(opcional)</span></label><input type="tel" placeholder="(51) 99999-9999"></div>
</div>
<div class="f-field"><label>Quantos clientes seu escritório atende?</label><select><option>Selecione</option><option>Até 50 clientes</option></select></div>
<div class="f-field" style="margin-bottom:0"><label>Mensagem <span class="opt">(opcional)</span></label><textarea placeholder="Conte um pouco sobre o seu escritório." style="min-height:64px"></textarea></div>
</body></html>
